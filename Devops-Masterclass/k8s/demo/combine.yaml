
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.25
          imagePullPolicy: Always
          env:
            - name: APP_MESSAGE
              value: "Hello from Ashu"
            - name: DB_PASSWORD
              value: "cGFzc3dvcmQ="  
          ports:
            - containerPort: 80    
--- 
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app: web
spec:
  type: NodePort
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      nodePort: 32042
